{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <!-- Map Section -->
    <section id="map-section" class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col">
        <div class="p-6 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
            <div>
                <h2 class="text-xl font-semibold text-gray-800">Select Location</h2>
                <p class="text-sm text-gray-500 mt-1">Click anywhere on the map to set your coordinates.</p>
            </div>
            <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        
        <!-- Search Box -->
        <div class="p-4 bg-white border-b border-gray-100 relative z-10">
            <div class="flex space-x-2">
                <input type="text" id="address-search" placeholder="Search for a city, landmark, or address..." 
                       class="flex-grow px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none"
                       autocomplete="off">
                <button type="button" id="search-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    Search
                </button>
            </div>
        </div>
        <div id="map-container" class="h-[500px] w-full z-0 relative">
            <!-- Leaflet map will render here -->
        </div>
    </section>

    <!-- Form Section -->
    <section id="instrument-selection" class="bg-white rounded-xl shadow-md border border-gray-100 p-8 flex flex-col justify-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Instrument Configuration</h2>
        
        <form action="{% url 'instruments:calculate' %}" method="get" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="latitude" class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
                    <input type="number" id="latitude" name="latitude" step="any" required 
                           value="{{ form.latitude.value|default:'' }}"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-gray-50 outline-none">
                </div>
                <div>
                    <label for="longitude" class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
                    <input type="number" id="longitude" name="longitude" step="any" required 
                           value="{{ form.longitude.value|default:'' }}"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-gray-50 outline-none">
                </div>
            </div>
            
            <div>
                <label for="instrument" class="block text-sm font-medium text-gray-700 mb-1">Instrument Type</label>
                <select id="instrument" name="instrument" required 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-gray-50 cursor-pointer outline-none">
                    <option value="samrat_yantra">Samrat Yantra (Equinoctial Sundial)</option>
                    <option value="nadi_valaya_yantra">Nadi Valaya Yantra (Equatorial Dial)</option>
                    <option value="bhitti_yantra">Bhitti Yantra (Meridian Dial)</option>
                </select>
            </div>
            
            <div>
                <label for="meridian" class="block text-sm font-medium text-gray-700 mb-1">Prime Meridian Reference</label>
                <select id="meridian" name="meridian" required 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-gray-50 cursor-pointer outline-none">
                    <option value="ujjain">Ujjain (Historical Indian Standard)</option>
                    <option value="greenwich">Greenwich (Modern Standard)</option>
                </select>
            </div>
            
            <div class="pt-4">
                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 outline-none focus:ring-4 focus:ring-indigo-300">
                    Calculate & Generate 3D Model
                </button>
            </div>
        </form>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Expose user ID to namespace LocalStorage preferences
    window.currentUserId = "{{ request.user.username|default:'guest' }}";
</script>
<script src="{% static 'js/map.js' %}"></script>
{% endblock %}
