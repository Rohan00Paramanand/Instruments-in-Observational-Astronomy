# render.yaml — Render Infrastructure as Code
# Defines the web service and PostgreSQL database in one file.
# Commit this to your repo and use "New Blueprint" on Render to deploy instantly.

services:
  - type: web
    name: astronomy-project
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: astronomy-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: astronomy-db
    plan: free
    databaseName: astronomy_db
    user: astronomy_user
